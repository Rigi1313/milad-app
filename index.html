<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#0a0f2a">
    <title>باشگاه میلاد مهر | اپلیکیشن رسمی</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #0a0f2a 0%, #0c122f 100%);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: #eef2ff;
            direction: rtl;
            min-height: 100vh;
            padding-bottom: 70px;
        }
        .header {
            background: rgba(15, 25, 55, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1100;
        }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-img { width: 48px; height: 48px; object-fit: contain; background: rgba(255,255,255,0.1); border-radius: 14px; padding: 4px; border: 1px solid rgba(255,215,0,0.3); }
        .logo h1 { font-size: 1.2rem; background: linear-gradient(135deg, #FFE6BC, #FFB347); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .logo p { font-size: 0.7rem; color: #8892b0; }
        .menu-btn { background: rgba(255,255,240,0.15); border: 1px solid rgba(255,215,0,0.4); border-radius: 40px; padding: 10px 18px; color: #ffd700; cursor: pointer; }
        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1040; display: none; }
        .sidebar-overlay.active { display: block; }
        .sidebar {
            position: fixed; top: 0; right: -300px; width: 280px; height: 100%;
            background: linear-gradient(135deg, rgba(10,20,45,0.98), rgba(5,12,28,0.98));
            backdrop-filter: blur(12px); border-left: 1px solid rgba(255,215,0,0.3);
            transition: right 0.3s; z-index: 1050; overflow-y: auto; display: flex; flex-direction: column;
        }
        .sidebar.open { right: 0; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid rgba(255,215,0,0.3); text-align: center; }
        .sidebar-header .avatar i { font-size: 3.5rem; color: #ffd966; }
        .sidebar-header h3 { color: #ffd700; font-size: 1.1rem; margin: 8px 0; }
        .sidebar-header p { color: #8892b0; font-size: 0.8rem; }
        .user-badge { display: inline-block; background: rgba(255,215,0,0.2); color: #ffd700; padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; margin-top: 5px; }
        .nav-menu { list-style: none; padding: 15px 12px; flex: 1; }
        .nav-menu li { margin-bottom: 5px; }
        .nav-menu li a {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px;
            color: #eef2ff; text-decoration: none; border-radius: 12px;
            background: rgba(255,255,245,0.03); cursor: pointer; font-size: 0.9rem;
        }
        .nav-menu li a i { width: 22px; color: #ffcd7e; text-align: center; }
        .nav-menu li a:hover { background: rgba(255,200,100,0.15); color: #ffd700; }
        .nav-menu li a.active { background: rgba(255,200,100,0.25); color: #ffd700; font-weight: bold; }
        .main-content { padding: 20px 16px; max-width: 800px; margin: 0 auto; }
        .card { background: rgba(20,30,58,0.7); backdrop-filter: blur(8px); border-radius: 20px; border: 1px solid rgba(255,215,0,0.2); padding: 24px; margin-bottom: 20px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .card-header h2 { font-size: 1.2rem; color: #ffd700; display: flex; align-items: center; gap: 8px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #8892b0; font-size: 0.85rem; }
        .glass-input, .glass-select, .glass-textarea {
            background: rgba(10,20,40,0.7); border: 1px solid rgba(255,215,0,0.3);
            border-radius: 12px; padding: 11px 16px; color: white; width: 100%;
            outline: none; font-size: 0.9rem; font-family: inherit;
        }
        .glass-input:focus, .glass-select:focus, .glass-textarea:focus { border-color: rgba(255,215,0,0.6); }
        .glass-textarea { resize: vertical; min-height: 80px; }
        .glass-select option { background: #0a0f2a; color: white; }
        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; border-radius: 12px; border: none; cursor: pointer; font-weight: bold; font-size: 0.85rem; font-family: inherit; }
        .btn-gold { background: linear-gradient(115deg, #e6b422, #f5c542); color: #1e2a3a; }
        .btn-red { background: linear-gradient(115deg, #c62828, #e53935); color: white; }
        .btn-green { background: linear-gradient(115deg, #2e7d32, #43a047); color: white; }
        .btn-blue { background: linear-gradient(115deg, #1565c0, #1e88e5); color: white; }
        .btn-edit { background: rgba(100,150,250,0.2); border: 1px solid #6495ed; color: #90caf9; }
        .btn-sm { padding: 6px 14px; font-size: 0.8rem; }
        .table-wrapper { overflow-x: auto; border-radius: 16px; background: rgba(0,0,0,0.3); margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 10px 8px; border-bottom: 1px solid rgba(255,215,0,0.15); text-align: right; font-size: 0.85rem; }
        th { background: rgba(255,215,0,0.15); color: #ffde9e; }
        tr:hover td { background: rgba(255,215,0,0.05); }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; }
        .badge-gold { background: rgba(255,215,0,0.2); color: #ffd700; }
        .badge-green { background: rgba(46,204,113,0.2); color: #2ecc71; }
        .badge-red { background: rgba(231,76,60,0.2); color: #e74c3c; }
        .badge-blue { background: rgba(52,152,219,0.2); color: #3498db; }
        .login-card { max-width: 420px; margin: 30px auto; text-align: center; }
        .role-btn { display: flex; align-items: center; gap: 12px; background: rgba(255,215,0,0.1); border: 1px solid rgba(255,215,0,0.3); padding: 14px 18px; border-radius: 16px; cursor: pointer; color: #eef2ff; width: 100%; font-family: inherit; margin-bottom: 10px; text-align: right; font-size: 0.9rem; }
        .role-btn:hover { background: rgba(255,215,0,0.2); }
        .role-btn i { font-size: 1.4rem; color: #ffd700; width: 28px; text-align: center; }
        .role-btn .role-info strong { display: block; color: #ffd700; }
        .role-btn .role-info small { color: #8892b0; font-size: 0.75rem; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: linear-gradient(135deg, #0a0f2a, #0c122f); border-radius: 24px; padding: 28px; max-width: 400px; width: 90%; border: 1px solid rgba(255,215,0,0.5); }
        .modal-content h3 { color: #ffd700; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
        .toast { position: fixed; top: 90px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); border: 1px solid #ffd700; color: #ffd700; padding: 10px 22px; border-radius: 30px; z-index: 3000; font-size: 0.85rem; display: none; }
        .toast.show { display: block; }
        .toast.error { border-color: #e74c3c; color: #e74c3c; }
        .toast.success { border-color: #2ecc71; color: #2ecc71; }
        .empty-state { text-align: center; padding: 30px; color: #8892b0; }
        .empty-state i { font-size: 3rem; color: rgba(255,215,0,0.3); margin-bottom: 12px; }
        .footer { background: rgba(5,10,25,0.95); text-align: center; padding: 14px; position: fixed; bottom: 0; width: 100%; font-size: 0.75rem; border-top: 1px solid rgba(255,215,0,0.2); color: #8892b0; }
        .flex-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-top: 15px; }
        .stat-card { background: rgba(255,215,0,0.08); border: 1px solid rgba(255,215,0,0.2); border-radius: 16px; padding: 18px; text-align: center; }
        .stat-card i { font-size: 1.8rem; color: #ffd700; margin-bottom: 8px; }
        .stat-card .stat-value { font-size: 1.6rem; font-weight: bold; color: #ffd700; }
        .stat-card .stat-label { color: #8892b0; font-size: 0.8rem; margin-top: 4px; }
        hr { border: none; border-top: 1px solid rgba(255,215,0,0.2); margin: 18px 0; }
        .mt-10 { margin-top: 10px; }
        @media (max-width: 600px) {
            .logo h1 { font-size: 1rem; }
            .logo-img { width: 40px; height: 40px; }
            .card { padding: 16px; }
            .btn { padding: 8px 16px; font-size: 0.8rem; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<div id="toast" class="toast"></div>

<header class="header">
    <div class="logo">
        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Cdefs%3E%3ClinearGradient id='grad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%231a237e;stop-opacity:1' /%3E%3Cstop offset='100%25' style='stop-color:%23283593;stop-opacity:1' /%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='200' height='200' fill='url(%23grad)' rx='30'/%3E%3Ccircle cx='100' cy='100' r='85' fill='none' stroke='%23ffd700' stroke-width='3'/%3E%3Ctext x='100' y='75' font-size='22' text-anchor='middle' fill='%23ffd700' font-weight='bold'%3E%D9%85%DB%8C%D9%84%D8%A7%D8%AF%3C/text%3E%3Ctext x='100' y='105' font-size='20' text-anchor='middle' fill='%23ffd700'%3E%D9%85%D9%87%D8%B1%3C/text%3E%3Ctext x='100' y='140' font-size='11' text-anchor='middle' fill='%23fff'%3E%D8%A8%D8%A7%D8%B4%DA%AF%D8%A7%D9%87%3C/text%3E%3C/svg%3E" class="logo-img">
        <div><h1>باشگاه میلاد مهر</h1><p>مهرآباد | نسخه ۲.۰</p></div>
    </div>
    <div class="flex-row">
        <button id="headerLogoutBtn" class="btn btn-red btn-sm" onclick="logout()" style="display:none;"><i class="fas fa-sign-out-alt"></i> خروج</button>
        <button class="menu-btn" id="toggleSidebarBtn"><i class="fas fa-bars"></i></button>
    </div>
</header>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="avatar"><i class="fas fa-user-circle"></i></div>
        <h3 id="sidebarUserName">کاربر مهمان</h3>
        <p id="sidebarUserRole">ورود نکرده</p>
        <span class="user-badge" id="sidebarUserBadge" style="display:none;"></span>
    </div>
    <ul class="nav-menu" id="navMenu"></ul>
</nav>

<main class="main-content" id="mainContent"></main>

<footer class="footer">© ۱۴۰۳ باشگاه میلاد مهر مهرآباد | اپلیکیشن رسمی</footer>

<!-- مودال کد تأیید -->
<div id="otpModal" class="modal">
    <div class="modal-content">
        <h3><i class="fas fa-key"></i> کد تأیید</h3>
        <p id="otpPhoneDisplay" style="color:#8892b0; margin-bottom:15px;"></p>
        <div class="form-group"><label>کد ۶ رقمی:</label><input type="text" id="otpCodeInput" class="glass-input" placeholder="مثال: ۱۲۳۴۵۶" maxlength="6" autocomplete="off"></div>
        <div class="modal-actions">
            <button class="btn btn-edit btn-sm" onclick="closeOTPModal()">انصراف</button>
            <button class="btn btn-gold" onclick="verifyOTP()"><i class="fas fa-check"></i> تأیید</button>
        </div>
    </div>
</div>

<!-- مودال ثبت‌نام بازیکن جدید -->
<div id="registerModal" class="modal">
    <div class="modal-content">
        <h3><i class="fas fa-user-plus"></i> تکمیل ثبت‌نام</h3>
        <p style="color:#8892b0; margin-bottom:15px;">شماره شما در سیستم نیست. لطفاً مشخصات خود را وارد کنید:</p>
        <div class="form-group"><label>نام:</label><input type="text" id="regName" class="glass-input" placeholder="نام"></div>
        <div class="form-group"><label>نام خانوادگی:</label><input type="text" id="regLastname" class="glass-input" placeholder="نام خانوادگی"></div>
        <div class="form-group"><label>پست:</label>
            <select id="regPosition" class="glass-select">
                <option value="">انتخاب کنید...</option>
                <option value="مهاجم">مهاجم</option>
                <option value="هافبک">هافبک</option>
                <option value="مدافع">مدافع</option>
                <option value="دروازه‌بان">دروازه‌بان</option>
            </select>
        </div>
        <div class="form-group"><label>سن:</label><input type="number" id="regAge" class="glass-input" placeholder="سن" min="5" max="99"></div>
        <div class="modal-actions">
            <button class="btn btn-edit btn-sm" onclick="closeRegisterModal()">انصراف</button>
            <button class="btn btn-green" onclick="completeRegistration()"><i class="fas fa-check"></i> ثبت‌نام</button>
        </div>
    </div>
</div>

<!-- مودال تأیید حذف -->
<div id="confirmModal" class="modal">
    <div class="modal-content">
        <h3 id="confirmTitle"><i class="fas fa-question-circle"></i> تأیید</h3>
        <p id="confirmMessage"></p>
        <div class="modal-actions">
            <button class="btn btn-edit btn-sm" onclick="closeConfirmModal()">انصراف</button>
            <button class="btn btn-red" id="confirmOkBtn">تأیید</button>
        </div>
    </div>
</div>

<script>
(function() {
    'use strict';

    // ======================== DATABASE ========================
    let currentUser = null;
    let passwords = { admin: 'admin123', coach: 'coach456', staff: 'staff789' };
    let db = {
        playersData: [],
        attendances: [],
        contracts: [],
        insurances: [],
        posts: [],
        clubProfile: { name: 'باشگاه میلاد مهر', year: '۱۳۹۵', stadium: 'ورزشگاه مهرآباد', manager: 'مدیر باشگاه', sports: 'فوتبال، فوتسال', address: 'مهرآباد', phone: '۰۲۱-۱۲۳۴۵۶۷۸', email: '', instagram: '' },
        otpStore: {}
    };
    let pendingPhoneForOTP = null;
    let pendingOTPCode = null;
    let pendingRegisterPhone = null;
    let confirmedAction = null;
    let deferredPrompt = null;

    function loadDB() {
        try {
            const d = (k) => { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; };
            const pd = d('milad_players_data'); if (pd) db.playersData = pd;
            const at = d('milad_attendances'); if (at) db.attendances = at;
            const ct = d('milad_contracts'); if (ct) db.contracts = ct;
            const ins = d('milad_insurances'); if (ins) db.insurances = ins;
            const ps = d('milad_posts'); if (ps) db.posts = ps;
            const cp = d('milad_clubprofile'); if (cp) db.clubProfile = cp;
            const ot = d('milad_otp_store'); if (ot) db.otpStore = ot;
            const pw = d('milad_passwords'); if (pw) passwords = pw;
            const cu = localStorage.getItem('milad_current_user'); if (cu) currentUser = JSON.parse(cu);
        } catch (e) { console.error('خطای بارگذاری:', e); }
    }

    function saveDB() {
        try {
            localStorage.setItem('milad_players_data', JSON.stringify(db.playersData));
            localStorage.setItem('milad_attendances', JSON.stringify(db.attendances));
            localStorage.setItem('milad_contracts', JSON.stringify(db.contracts));
            localStorage.setItem('milad_insurances', JSON.stringify(db.insurances));
            localStorage.setItem('milad_posts', JSON.stringify(db.posts));
            localStorage.setItem('milad_clubprofile', JSON.stringify(db.clubProfile));
            localStorage.setItem('milad_otp_store', JSON.stringify(db.otpStore));
            localStorage.setItem('milad_passwords', JSON.stringify(passwords));
            if (currentUser) localStorage.setItem('milad_current_user', JSON.stringify(currentUser));
            else localStorage.removeItem('milad_current_user');
        } catch (e) { showToast('خطا در ذخیره‌سازی', 'error'); }
    }

    function showToast(msg, type = '') {
        const t = document.getElementById('toast');
        t.textContent = msg; t.className = 'toast ' + type + ' show';
        clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 3000);
    }

    function cleanPhone(phone) {
        if (!phone) return '';
        let c = phone.replace(/[^0-9]/g, '');
        if (c.startsWith('0')) c = c.substring(1);
        if (c.startsWith('98')) c = c.substring(2);
        return c;
    }

    function formatPhone(phone) { return '0' + cleanPhone(phone); }

    function findPlayerByPhone(phone) {
        const cp = cleanPhone(phone);
        return db.playersData.find(p => cleanPhone(p.phone) === cp);
    }

    // ======================== OTP ========================
    function generateOTP() { return Math.floor(100000 + Math.random() * 900000).toString(); }

    function sendOTP(phone) {
        const fp = formatPhone(phone);
        pendingPhoneForOTP = fp;
        pendingOTPCode = generateOTP();
        db.otpStore[fp] = { code: pendingOTPCode, expires: Date.now() + 300000 };
        console.log(`🔑 کد برای ${fp}: ${pendingOTPCode}`);
        document.getElementById('otpPhoneDisplay').innerHTML = `کد به <strong>${fp}</strong> ارسال شد.<br><small style="color:#8892b0;">(کد در کنسول مرورگر)</small>`;
        document.getElementById('otpCodeInput').value = '';
        document.getElementById('otpModal').classList.add('active');
        setTimeout(() => document.getElementById('otpCodeInput').focus(), 300);
        saveDB();
    }

    function verifyOTP() {
        const code = document.getElementById('otpCodeInput').value.trim();
        if (!code || code.length !== 6) { showToast('کد ۶ رقمی وارد کنید', 'error'); return; }
        const otpData = db.otpStore[pendingPhoneForOTP];
        if (!otpData || Date.now() > otpData.expires) { showToast('کد منقضی شده', 'error'); closeOTPModal(); return; }
        if (code !== otpData.code) { showToast('کد اشتباه است', 'error'); document.getElementById('otpCodeInput').value = ''; return; }
        const player = findPlayerByPhone(pendingPhoneForOTP);
        if (!player) { showToast('بازیکن یافت نشد', 'error'); closeOTPModal(); return; }
        currentUser = { role: 'player', name: player.name + ' ' + (player.lastname || ''), phone: pendingPhoneForOTP, permissions: 'self' };
        delete db.otpStore[pendingPhoneForOTP];
        saveDB(); closeOTPModal(); updateUI(); navigateTo('home');
        showToast(`خوش آمدید ${player.name}`, 'success');
    }

    function closeOTPModal() { document.getElementById('otpModal').classList.remove('active'); pendingPhoneForOTP = null; pendingOTPCode = null; }

    // ======================== ثبت‌نام خودکار بازیکن ========================
    function openRegisterModal(phone) {
        pendingRegisterPhone = formatPhone(phone);
        document.getElementById('regName').value = '';
        document.getElementById('regLastname').value = '';
        document.getElementById('regPosition').value = '';
        document.getElementById('regAge').value = '';
        document.getElementById('registerModal').classList.add('active');
        setTimeout(() => document.getElementById('regName').focus(), 300);
    }

    function closeRegisterModal() { document.getElementById('registerModal').classList.remove('active'); pendingRegisterPhone = null; }

    function completeRegistration() {
        const name = document.getElementById('regName').value.trim();
        const lastname = document.getElementById('regLastname').value.trim();
        const position = document.getElementById('regPosition').value;
        const age = document.getElementById('regAge').value.trim();
        if (!name) { showToast('نام الزامی است', 'error'); return; }
        if (!lastname) { showToast('نام خانوادگی الزامی است', 'error'); return; }
        if (!position) { showToast('پست را انتخاب کنید', 'error'); return; }
        if (!age || isNaN(age) || age < 5 || age > 99) { showToast('سن معتبر وارد کنید (۵ تا ۹۹)', 'error'); return; }
        if (findPlayerByPhone(pendingRegisterPhone)) { showToast('این شماره قبلاً ثبت شده', 'error'); return; }
        db.playersData.push({ name, lastname, position, shirt: '', age, phone: pendingRegisterPhone });
        saveDB(); closeRegisterModal();
        const fp = pendingRegisterPhone;
        pendingPhoneForOTP = fp;
        pendingOTPCode = generateOTP();
        db.otpStore[fp] = { code: pendingOTPCode, expires: Date.now() + 300000 };
        console.log(`🔑 کد برای ${fp}: ${pendingOTPCode}`);
        document.getElementById('otpPhoneDisplay').innerHTML = `ثبت‌نام انجام شد! کد به <strong>${fp}</strong> ارسال شد.<br><small style="color:#8892b0;">(کد در کنسول مرورگر)</small>`;
        document.getElementById('otpCodeInput').value = '';
        document.getElementById('otpModal').classList.add('active');
        setTimeout(() => document.getElementById('otpCodeInput').focus(), 300);
        saveDB();
        showToast('ثبت‌نام با موفقیت انجام شد. کد را وارد کنید.', 'success');
    }

    // ======================== AUTH ========================
    window.loginAs = function(role) {
        const pass = prompt('رمز ' + (role === 'admin' ? 'مدیر' : role === 'coach' ? 'کادر فنی' : 'کادر اجرایی') + ':');
        if (pass === passwords[role]) {
            currentUser = { role, name: role === 'admin' ? 'مدیر' : role === 'coach' ? 'مربی' : 'کادر', permissions: role === 'admin' ? 'full' : role === 'coach' ? 'edit_players,attendance' : 'view' };

    window.loginPlayer = function() {
        const phone = prompt('📱 شماره موبایل:\n(مثال: 09123456789)');
        if (!phone) return;
        const cp = cleanPhone(phone);
        if (cp.length < 10) { showToast('شماره معتبر وارد کنید', 'error'); return; }
        const player = findPlayerByPhone(phone);
        if (player) { sendOTP(phone); }

    // ======================== CONFIRM MODAL ========================
    function showConfirm(msg, title, cb) {
        document.getElementById('confirmMessage').textContent = msg;
        document.getElementById('confirmTitle').innerHTML = '<i class="fas fa-question-circle"></i> ' + title;
        document.getElementById('confirmModal').classList.add('active');
        confirmedAction = cb;
        document.getElementById('confirmOkBtn').onclick = () => { if (confirmedAction) confirmedAction(); closeConfirmModal(); };
    }
    function closeConfirmModal() { document.getElementById('confirmModal').classList.remove('active'); confirmedAction = null; }

    // ======================== NAVIGATION ========================
    function navigateTo(page) {
        let content = '';
        if (!currentUser && page !== 'login') page = 'login';
        switch (page) {
            case 'login': content = renderLogin(); break;
            case 'home': content = renderHome(); break;
            case 'profile': content = renderProfile(); break;
            case 'players': content = renderPlayers(); break;
            case 'attendance': content = renderAttendance(); break;
            case 'contracts': content = renderContracts(); break;
            case 'insurance': content = renderInsurance(); break;
            case 'posts': content = renderPosts(); break;
            case 'contact': content = renderContact(); break;
            case 'settings': content = renderSettings(); break;
            case 'myAttendance': content = renderMyAttendance(); break;
            case 'myContract': content = renderMyContract(); break;
            case 'myInsurance': content = renderMyInsurance(); break;
            case 'backup': content = renderBackup(); break;
            default: content = renderHome();
        }
        document.getElementById('mainContent').innerHTML = content;
        document.querySelectorAll('.nav-menu li a').forEach(a => a.classList.remove('active'));
        const links = document.querySelectorAll('.nav-menu li a');
        links.forEach(a => { if (a.getAttribute('onclick') && a.getAttribute('onclick').includes(`'${page}'`)) a.classList.add('active'); });
        closeSidebar();
    }

    function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('active'); }

    function updateUI() {
        const menu = document.getElementById('navMenu');
        let html = '';
        if (!currentUser) {
            html = '<li><a onclick="navigateTo(\'login\')" class="active"><i class="fas fa-sign-in-alt"></i> ورود</a></li><li><a onclick="installPWA()"><i class="fas fa-download"></i> نصب اپ</a></li>';

                html += '<li><a onclick="navigateTo(\'players\')"><i class="fas fa-users"></i> بازیکنان</a></li><li><a onclick="navigateTo(\'attendance\')"><i class="fas fa-clipboard-check"></i> حضور و غیاب</a></li><li><a onclick="navigateTo(\'contracts\')"><i class="fas fa-file-contract"></i> قراردادها</a></li><li><a onclick="navigateTo(\'insurance\')"><i class="fas fa-shield-alt"></i> بیمه</a></li><li><a onclick="navigateTo(\'posts\')"><i class="fas fa-bullhorn"></i> اطلاعیه‌ها</a></li>';
            }

                html += '<li><a onclick="navigateTo(\'settings\')"><i class="fas fa-cog"></i> تنظیمات</a></li><li><a onclick="navigateTo(\'backup\')"><i class="fas fa-database"></i> پشتیبان‌گیری</a></li>';
            }
            if (currentUser.role === 'player') {
                html += '<li><a onclick="navigateTo(\'myAttendance\')"><i class="fas fa-calendar-check"></i> حضورهای من</a></li><li><a onclick="navigateTo(\'myContract\')"><i class="fas fa-file-signature"></i> قرارداد من</a></li><li><a onclick="navigateTo(\'myInsurance\')"><i class="fas fa-shield-alt"></i> بیمه من</a></li>';
            }

        menu.innerHTML = html;

        const lastname = prompt('نام خانوادگی:') || '';
        const position = prompt('پست:') || '';
        const shirt = prompt('شماره پیراهن:') || '';
        const age = prompt('سن:') || '';
        let phone = prompt('موبایل (مثال: 09123456789):') || '';
        if (phone) { phone = formatPhone(phone); if (findPlayerByPhone(phone)) { showToast('این شماره قبلاً ثبت شده', 'error'); return; } }
        db.playersData.push({ name, lastname, position, shirt, age, phone });
        saveDB(); navigateTo('players'); showToast('بازیکن افزوده شد', 'success');
    };

    window.editPlayer = function(i) {
        const p = db.playersData[i]; if (!p) return;
        const name = prompt('نام:', p.name); if (name === null) return;
        const lastname = prompt('نام خانوادگی:', p.lastname); if (lastname === null) return;
        const position = prompt('پست:', p.position); if (position === null) return;
        const shirt = prompt('شماره:', p.shirt); if (shirt === null) return;
        const age = prompt('سن:', p.age); if (age === null) return;
        let phone = prompt('موبایل:', p.phone); if (phone === null) return;
        if (phone) { phone = formatPhone(phone); const dup = db.playersData.find((pl, idx) => idx !== i && cleanPhone(pl.phone) === cleanPhone(phone)); if (dup) { showToast('شماره تکراری', 'error'); return; } }
        Object.assign(p, { name, lastname, position, shirt, age, phone });
        saveDB(); navigateTo('players'); showToast('ویرایش شد', 'success');
    };

        const p = db.playersData[i];
        showConfirm(`حذف "${p.name} ${p.lastname}"؟`, 'حذف بازیکن', () => { db.playersData.splice(i, 1); saveDB(); navigateTo('players'); showToast('حذف شد', 'success'); });

            <div class="form-group"><label>رمز کادر اجرایی:</label><input id="newStaff" class="glass-input" value="${passwords.staff}"></div>
            <button class="btn btn-gold" onclick="savePasswords()"><i class="fas fa-save"></i> ذخیره</button>
            <hr><h3 style="color:#e74c3c;">بازنشانی کامل</h3><p style="color:#8892b0;">تمام داده‌ها پاک می‌شود.</p>
            <button class="btn btn-red" onclick="resetAll()"><i class="fas fa-exclamation-triangle"></i> بازنشانی</button></div>`;
    }
    window.savePasswords = function() {
        const a = document.getElementById('newAdmin')?.value; if (a) passwords.admin = a;
        const c = document.getElementById('newCoach')?.value; if (c) passwords.coach = c;
        const s = document.getElementById('newStaff')?.value; if (s) passwords.staff = s;
        saveDB(); showToast('رمزها ذخیره شد', 'success');
    };
    window.resetAll = function() { showConfirm('همه چیز پاک شود؟', 'بازنشانی', () => { localStorage.clear(); location.reload(); }); };

    function renderBackup() {
        if (currentUser?.role !== 'admin') return '<div class="card"><p>فقط مدیر</p></div>';
        return `<div class="card"><div class="card-header"><h2><i class="fas fa-database"></i> پشتیبان‌گیری</h2></div>
            <div class="flex-row"><button class="btn btn-blue" onclick="exportBackup()"><i class="fas fa-download"></i> دانلود پشتیبان</button>
            <button class="btn btn-gold" onclick="document.getElementById('backupFile').click()"><i class="fas fa-upload"></i> بازیابی</button></div>
            <input type="file" id="backupFile" accept=".json" style="display:none;" onchange="importBackup(event)">
            <hr><div class="flex-row"><span class="badge badge-gold">${db.playersData.length} بازیکن</span><span class="badge badge-blue">${db.attendances.length} حضور</span><span class="badge badge-green">${db.contracts.length} قرارداد</span></div></div>`;
    }
    window.exportBackup = function() {
        const data = { playersData: db.playersData, attendances: db.attendances, contracts: db.contracts, insurances: db.insurances, posts: db.posts, clubProfile: db.clubProfile, passwords, date: new Date().toLocaleString('fa-IR') };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'miladmehr_backup.json'; a.click();
        showToast('دانلود شد', 'success');
    };
    window.importBackup = function(e) {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            try {
                const data = JSON.parse(ev.target.result);
                showConfirm('اطلاعات فعلی جایگزین شود؟', 'بازیابی', () => {
                    if (data.playersData) db.playersData = data.playersData;
                    if (data.attendances) db.attendances = data.attendances;
                    if (data.contracts) db.contracts = data.contracts;
                    if (data.insurances) db.insurances = data.insurances;
                    if (data.posts) db.posts = data.posts;
                    if (data.clubProfile) db.clubProfile = data.clubProfile;
                    if (data.passwords) passwords = data.passwords;
                    saveDB(); navigateTo('home'); showToast('بازیابی شد', 'success');
                });
            } catch (err) { showToast('فایل نامعتبر', 'error'); }
        };
        reader.readAsText(file);
    };

    function renderMyAttendance() {
        const my = db.attendances.filter(a => a.playerName === currentUser?.name);
        return `<div class="card"><div class="card-header"><h2><i class="fas fa-calendar-check"></i> حضورهای من</h2></div>${my.length === 0 ? '<div class="empty-state"><p>موردی ثبت نشده</p></div>' : my.map(a => `<div style="padding:8px 0;border-bottom:1px solid rgba(255,215,0,0.15);display:flex;justify-content:space-between;"><span>${a.date}</span><span class="badge ${a.status==='حاضر'?'badge-green':'badge-red'}">${a.status}</span></div>`).join('')}</div>`;
    }
    function renderMyContract() {
        const c = db.contracts.find(c => c.playerName === currentUser?.name);
        return `<div class="card"><div class="card-header"><h2><i class="fas fa-file-signature"></i> قرارداد من</h2></div>${c ? `<div><p><strong style="color:#ffd700;">مبلغ:</strong> ${c.amount} تومان</p><p><strong style="color:#ffd700;">شروع:</strong> ${c.start}</p><p><strong style="color:#ffd700;">پایان:</strong> ${c.end}</p></div>` : '<div class="empty-state"><p>قراردادی ثبت نشده</p></div>'}</div>`;
    }
    function renderMyInsurance() {
        const ins = db.insurances.find(i => i.playerName === currentUser?.name);
        return `<div class="card"><div class="card-header"><h2><i class="fas fa-shield-alt"></i> بیمه من</h2></div>${ins ? `<div><p><strong style="color:#ffd700;">شرکت:</strong> ${ins.company}</p><p><strong style="color:#ffd700;">کد:</strong> ${ins.code}</p><p><strong style="color:#ffd700;">انقضا:</strong> ${ins.expiry}</p></div>` : '<div class="empty-state"><p>بیمه‌ای ثبت نشده</p></div>'}</div>`;
    }

    window.installPWA = function() {
        if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; }
        else { showToast('از منوی مرورگر نصب کنید', 'success'); }
    };

    // ======================== EVENTS ========================
    document.getElementById('toggleSidebarBtn').onclick = () => { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebarOverlay').classList.toggle('active'); };
    document.getElementById('sidebarOverlay').onclick = closeSidebar;
    document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeSidebar(); closeOTPModal(); closeRegisterModal(); closeConfirmModal(); } });
    document.getElementById('otpModal').onclick = function(e) { if (e.target === this) closeOTPModal(); };
    document.getElementById('registerModal').onclick = function(e) { if (e.target === this) closeRegisterModal(); };
    document.getElementById('confirmModal').onclick = function(e) { if (e.target === this) closeConfirmModal(); };
    document.getElementById('otpCodeInput').oninput = function() { if (this.value.length === 6) verifyOTP(); };
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; });

    window.closeOTPModal = closeOTPModal;
    window.closeRegisterModal = closeRegisterModal;
    window.closeConfirmModal = closeConfirmModal;
    window.verifyOTP = verifyOTP;
    window.completeRegistration = completeRegistration;
    window.navigateTo = navigateTo;

    // ======================== INIT ========================
    loadDB();
    updateUI();
    navigateTo(currentUser ? 'home' : 'login');
})();
</script>
</body>
        </html>
