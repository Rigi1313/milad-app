    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:linear-gradient(145deg,#0a0f2a,#0c122f);font-family:'Segoe UI',Tahoma,sans-serif;color:#eef2ff;direction:rtl;min-height:100vh;padding-bottom:60px}
        .header{background:rgba(15,25,55,0.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,215,0,0.3);padding:10px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1100}
        .logo{display:flex;align-items:center;gap:10px}
        .logo img{width:42px;height:42px;border-radius:12px;border:1px solid rgba(255,215,0,0.3)}
        .logo h1{font-size:1.1rem;background:linear-gradient(135deg,#FFE6BC,#FFB347);-webkit-background-clip:text;background-clip:text;color:transparent}
        .logo p{font-size:0.65rem;color:#8892b0}
        .menu-btn{background:rgba(255,255,240,0.15);border:1px solid rgba(255,215,0,0.4);border-radius:30px;padding:8px 16px;color:#ffd700;cursor:pointer;font-size:0.9rem}
        .sidebar-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:1040;display:none}
        .sidebar-overlay.active{display:block}
        .sidebar{position:fixed;top:0;right:-280px;width:260px;height:100%;background:rgba(10,20,45,0.98);border-left:1px solid rgba(255,215,0,0.3);transition:right 0.3s;z-index:1050;overflow-y:auto;padding:20px 0}
        .sidebar.open{right:0}
        .sidebar .user{padding:15px;text-align:center;border-bottom:1px solid rgba(255,215,0,0.3);margin-bottom:10px}
        .sidebar .user i{font-size:3rem;color:#ffd966}
        .sidebar .user h3{color:#ffd700;font-size:1rem;margin:5px 0}
        .sidebar .user p{color:#8892b0;font-size:0.75rem}
        .sidebar a{display:flex;align-items:center;gap:10px;padding:12px 18px;color:#eef2ff;text-decoration:none;font-size:0.85rem;cursor:pointer}
        .sidebar a i{width:20px;color:#ffcd7e;text-align:center}
        .sidebar a:hover,.sidebar a.active{background:rgba(255,200,100,0.15);color:#ffd700}
        .main{padding:16px 12px;max-width:700px;margin:0 auto}
        .card{background:rgba(20,30,58,0.7);backdrop-filter:blur(8px);border-radius:16px;border:1px solid rgba(255,215,0,0.2);padding:20px;margin-bottom:16px}
        .card h2{font-size:1.1rem;color:#ffd700;margin-bottom:15px;display:flex;align-items:center;gap:8px}
        .btn{display:inline-flex;align-items:center;gap:5px;padding:8px 18px;border-radius:10px;border:none;cursor:pointer;font-weight:bold;font-size:0.8rem;font-family:inherit}
        .btn-gold{background:linear-gradient(115deg,#e6b422,#f5c542);color:#1e2a3a}
        .btn-red{background:linear-gradient(115deg,#c62828,#e53935);color:#fff}
        .btn-green{background:linear-gradient(115deg,#2e7d32,#43a047);color:#fff}
        .btn-blue{background:linear-gradient(115deg,#1565c0,#1e88e5);color:#fff}
        .btn-orange{background:linear-gradient(115deg,#e65100,#ff6d00);color:#fff}
        .btn-sm{padding:5px 12px;font-size:0.7rem}
        .btn-xs{padding:3px 8px;font-size:0.65rem}
        input,select,textarea{background:rgba(10,20,40,0.7);border:1px solid rgba(255,215,0,0.3);border-radius:10px;padding:10px 14px;color:#fff;width:100%;outline:none;font-size:0.85rem;font-family:inherit;margin-bottom:10px}
        input:focus,select:focus,textarea:focus{border-color:rgba(255,215,0,0.6)}
        select option{background:#0a0f2a;color:#fff}
        textarea{resize:vertical;min-height:70px}
        table{width:100%;border-collapse:collapse;font-size:0.8rem;margin-top:10px}
        th,td{padding:8px 6px;border-bottom:1px solid rgba(255,215,0,0.15);text-align:right}
        th{background:rgba(255,215,0,0.15);color:#ffde9e}
        .badge{display:inline-block;padding:3px 10px;border-radius:15px;font-size:0.7rem}
        .badge-green{background:rgba(46,204,113,0.2);color:#2ecc71}
        .badge-red{background:rgba(231,76,60,0.2);color:#e74c3c}
        .badge-gold{background:rgba(255,215,0,0.2);color:#ffd700}
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:2000;justify-content:center;align-items:center}
        .modal.active{display:flex}
        .modal-content{background:#0a0f2a;border-radius:20px;padding:24px;max-width:380px;width:90%;border:1px solid rgba(255,215,0,0.5)}
        .modal-content h3{color:#ffd700;margin-bottom:15px}
        .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);border:1px solid #ffd700;color:#ffd700;padding:8px 20px;border-radius:20px;z-index:3000;font-size:0.8rem;display:none}
        .toast.show{display:block}
        .toast.error{border-color:#e74c3c;color:#e74c3c}
        .toast.success{border-color:#2ecc71;color:#2ecc71}
        .footer{background:rgba(5,10,25,0.95);text-align:center;padding:12px;position:fixed;bottom:0;width:100%;font-size:0.7rem;border-top:1px solid rgba(255,215,0,0.2);color:#8892b0}
        .flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

        .player-row{display:flex;align-items:center;justify-content:space-between;padding:10px;border-bottom:1px solid rgba(255,215,0,0.15);flex-wrap:wrap;gap:8px}
        .player-row .info{flex:1;min-width:120px}
        .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin-top:10px}
        .stat-card{background:rgba(255,215,0,0.08);border:1px solid rgba(255,215,0,0.2);border-radius:12px;padding:15px;text-align:center}
        .stat-card i{font-size:1.5rem;color:#ffd700}
        .stat-card .val{font-size:1.4rem;font-weight:bold;color:#ffd700}
        .stat-card .lbl{color:#8892b0;font-size:0.7rem}
        .install-banner{background:rgba(255,109,0,0.15);border:1px solid rgba(255,109,0,0.4);border-radius:12px;padding:15px;text-align:center;margin-bottom:15px;display:none}
        .install-banner.show{display:block}
        hr{border:none;border-top:1px solid rgba(255,215,0,0.2);margin:15px 0}
        .mt-10{margin-top:10px}
        .master-key{font-family:monospace;background:rgba(0,0,0,0.5);padding:6px 12px;border-radius:6px;color:#ff6d00;font-size:1rem}

<body>
<div id="toast" class="toast"></div>

<header class="header">
    <div class="logo">
        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%231a237e'/%3E%3Cstop offset='100%25' style='stop-color:%23283593'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='200' height='200' fill='url(%23g)' rx='30'/%3E%3Ccircle cx='100' cy='100' r='85' fill='none' stroke='%23ffd700' stroke-width='3'/%3E%3Ctext x='100' y='75' font-size='22' text-anchor='middle' fill='%23ffd700' font-weight='bold'%3E%D9%85%DB%8C%D9%84%D8%A7%D8%AF%3C/text%3E%3Ctext x='100' y='105' font-size='20' text-anchor='middle' fill='%23ffd700'%3E%D9%85%D9%87%D8%B1%3C/text%3E%3Ctext x='100' y='140' font-size='11' text-anchor='middle' fill='%23fff'%3E%D8%A8%D8%A7%D8%B4%DA%AF%D8%A7%D9%87%3C/text%3E%3C/svg%3E" alt="logo">
        <div><h1>باشگاه میلاد مهر</h1><p>مهرآباد</p></div>
    </div>
    <div class="flex">
        <button id="logoutBtn" class="btn btn-red btn-sm" onclick="logout()" style="display:none"><i class="fas fa-sign-out-alt"></i></button>
        <button class="menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
    </div>
</header>

<div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>
<nav class="sidebar" id="sidebar">
    <div class="user">
        <i class="fas fa-user-circle"></i>
        <h3 id="sName">کاربر مهمان</h3>
        <p id="sRole">ورود نکرده</p>
    </div>
    <div id="menu"></div>
</nav>

<main class="main" id="main"></main>
<footer class="footer">© ۱۴۰۳ باشگاه میلاد مهر | نسخه نصبی ۲.۱</footer>

<div id="modal" class="modal"><div class="modal-content" id="modalContent"></div></div>

<script>
(function(){
const MASTER_KEY='miladmehr1403';
let currentUser=null;
let passwords={admin:'admin123',coach:'coach456',staff:'staff789'};
let db={playersData:[],attendances:[],contracts:[],insurances:[],posts:[],clubProfile:{name:'باشگاه میلاد مهر',year:'۱۳۹۵',stadium:'ورزشگاه مهرآباد',manager:'مدیر باشگاه',sports:'فوتبال، فوتسال',address:'مهرآباد',phone:'۰۲۱-۱۲۳۴۵۶۷۸',email:'',instagram:''}};
let deferredPrompt=null;
let confirmedAction=null;

function load(){
try{
let d=k=>{let v=localStorage.getItem(k);return v?JSON.parse(v):null};
let pd=d('mpd');if(pd)db.playersData=pd;
let at=d('mat');if(at)db.attendances=at;
let ct=d('mct');if(ct)db.contracts=ct;
let ins=d('min');if(ins)db.insurances=ins;
let ps=d('mps');if(ps)db.posts=ps;
let cp=d('mcp');if(cp)db.clubProfile=cp;
let pw=d('mpw');if(pw)passwords=pw;
let cu=localStorage.getItem('mcu');if(cu)currentUser=JSON.parse(cu);
}catch(e){}
}
function save(){
try{
localStorage.setItem('mpd',JSON.stringify(db.playersData));
localStorage.setItem('mat',JSON.stringify(db.attendances));
localStorage.setItem('mct',JSON.stringify(db.contracts));
localStorage.setItem('min',JSON.stringify(db.insurances));
localStorage.setItem('mps',JSON.stringify(db.posts));
localStorage.setItem('mcp',JSON.stringify(db.clubProfile));
localStorage.setItem('mpw',JSON.stringify(passwords));
if(currentUser)localStorage.setItem('mcu',JSON.stringify(currentUser));
else localStorage.removeItem('mcu');
}catch(e){toast('خطا در ذخیره‌سازی','error')}
}
function toast(m,t=''){
let el=document.getElementById('toast');
el.textContent=m;el.className='toast '+t+' show';
clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),3000);
}
function gid(){return Date.now()+'_'+Math.random().toString(36).substr(2,5)}
function toggleSidebar(){
document.getElementById('sidebar').classList.toggle('open');
document.getElementById('overlay').classList.toggle('active');
}
function openModal(html){
document.getElementById('modalContent').innerHTML=html;
document.getElementById('modal').classList.add('active');
}
function closeModal(){document.getElementById('modal').classList.remove('active')}
function confirm(msg,title,cb){
openModal(`<h3><i class="fas fa-question-circle"></i> ${title}</h3><p>${msg}</p><div class="flex" style="justify-content:flex-end;margin-top:15px"><button class="btn btn-sm" style="background:rgba(255,255,255,0.1);color:#fff" onclick="closeModal()">انصراف</button><button class="btn btn-red btn-sm" id="confirmOk">تأیید</button></div>`);
document.getElementById('confirmOk').onclick=()=>{if(cb)cb();closeModal();};
}
window.closeModal=closeModal;

function updateUI(){
let menu='';
if(!currentUser){
menu='<a onclick="nav(\'login\')" class="active"><i class="fas fa-sign-in-alt"></i> ورود</a><a onclick="install()"><i class="fas fa-download"></i> نصب اپ</a>';
}else{
menu='<a onclick="nav(\'home\')"><i class="fas fa-home"></i> داشبورد</a><a onclick="nav(\'profile\')"><i class="fas fa-building"></i> مشخصات باشگاه</a>';
if(['admin','coach','staff'].includes(currentUser.role)){
menu+='<a onclick="nav(\'players\')"><i class="fas fa-users"></i> بازیکنان</a><a onclick="nav(\'attendance\')"><i class="fas fa-clipboard-check"></i> حضور و غیاب</a><a onclick="nav(\'contracts\')"><i class="fas fa-file-contract"></i> قراردادها</a><a onclick="nav(\'insurance\')"><i class="fas fa-shield-alt"></i> بیمه</a><a onclick="nav(\'posts\')"><i class="fas fa-bullhorn"></i> اطلاعیه‌ها</a>';
}
if(currentUser.role==='admin')menu+='<a onclick="nav(\'settings\')"><i class="fas fa-cog"></i> تنظیمات</a><a onclick="nav(\'backup\')"><i class="fas fa-database"></i> پشتیبان‌گیری</a>';
if(currentUser.role==='player')menu+='<a onclick="nav(\'myAttendance\')"><i class="fas fa-calendar-check"></i> حضورهای من</a><a onclick="nav(\'myContract\')"><i class="fas fa-file-signature"></i> قرارداد من</a><a onclick="nav(\'myInsurance\')"><i class="fas fa-shield-alt"></i> بیمه من</a>';
menu+='<a onclick="nav(\'contact\')"><i class="fas fa-headset"></i> ارتباط</a><a onclick="install()"><i class="fas fa-download"></i> نصب اپ</a><a onclick="logout()" style="color:#e74c3c"><i class="fas fa-sign-out-alt"></i> خروج</a>';
}
document.getElementById('menu').innerHTML=menu;
document.getElementById('sName').textContent=currentUser?currentUser.name:'کاربر مهمان';
let roles={admin:'مدیر',coach:'مربی',staff:'کادر',player:'بازیکن'};
document.getElementById('sRole').textContent=currentUser?roles[currentUser.role]||'':'ورود نکرده';
document.getElementById('logoutBtn').style.display=currentUser?'inline-flex':'none';
}

function nav(page){
if(!currentUser&&page!=='login')page='login';
let c='';
switch(page){
case'login':c=renderLogin();break;
case'home':c=renderHome();break;
case'profile':c=renderProfile();break;
case'players':c=renderPlayers();break;
case'attendance':c=renderAttendance();break;
case'contracts':c=renderContracts();break;
case'insurance':c=renderInsurance();break;
case'posts':c=renderPosts();break;
case'contact':c=renderContact();break;
case'settings':c=renderSettings();break;
case'myAttendance':c=renderMyAttendance();break;
case'myContract':c=renderMyContract();break;
case'myInsurance':c=renderMyInsurance();break;
case'backup':c=renderBackup();break;
default:c=renderHome();
}
document.getElementById('main').innerHTML=c;
document.querySelectorAll('#menu a').forEach(a=>a.classList.remove('active'));
document.querySelectorAll('#menu a').forEach(a=>{if(a.getAttribute('onclick')&&a.getAttribute('onclick').includes("'"+page+"'"))a.classList.add('active')});
if(window.innerWidth<600)toggleSidebar();
}

// ======= LOGIN =======
window.loginAdmin=()=>{let p=prompt('رمز مدیر:');if(p===passwords.admin){currentUser={role:'admin',name:'مدیر',permissions:'full'};save();updateUI();nav('home');toast('خوش آمدید','success')}else if(p!==null)toast('رمز اشتباه','error')};
window.loginCoach=()=>{let p=prompt('رمز کادر فنی:');if(p===passwords.coach){currentUser={role:'coach',name:'مربی',permissions:'edit_players,attendance'};save();updateUI();nav('home');toast('خوش آمدید','success')}else if(p!==null)toast('رمز اشتباه','error')};
window.loginStaff=()=>{let p=prompt('رمز کادر اجرایی:');if(p===passwords.staff){currentUser={role:'staff',name:'کادر',permissions:'view'};save();updateUI();nav('home');toast('خوش آمدید','success')}else if(p!==null)toast('رمز اشتباه','error')};
window.loginPlayer=()=>{
let n=prompt('نام:');if(!n||!n.trim())return;
let l=prompt('نام خانوادگی:');if(!l||!l.trim())return;
let p=db.playersData.find(x=>x.name===n.trim()&&x.lastname===l.trim());
if(!p){let pos=prompt('پست:(مهاجم/هافبک/مدافع/دروازه‌بان)','هافبک')||'هافبک';let age=prompt('سن:','۲۰')||'۲۰';p={id:gid(),name:n.trim(),lastname:l.trim(),position:pos,shirt:'',age:age,phone:'',registeredAt:new Date().toLocaleDateString('fa-IR')};db.playersData.push(p);save()}
currentUser={role:'player',name:n.trim()+' '+l.trim(),playerId:p.id,permissions:'self'};save();updateUI();nav('home');toast('خوش آمدید','success')
};
window.logout=()=>{currentUser=null;save();updateUI();nav('login');toast('خارج شدید','success')};

// ======= RECOVERY =======
window.recover=()=>{
openModal(`<h3><i class="fas fa-unlock-alt"></i> بازیابی رمز</h3><p style="color:#ff6d00;margin-bottom:10px">کلید اصلی:</p><div class="master-key">${MASTER_KEY}</div><input id="mk" placeholder="کلید اصلی را وارد کنید" style="margin-top:10px"><div class="flex" style="justify-content:flex-end;margin-top:15px"><button class="btn btn-sm" style="background:rgba(255,255,255,0.1);color:#fff" onclick="closeModal()">انصراف</button><button class="btn btn-orange btn-sm" onclick="doRecover()">بازیابی</button></div>`);
};
window.doRecover=()=>{
if(document.getElementById('mk').value.trim()===MASTER_KEY){passwords={admin:'admin123',coach:'coach456',staff:'staff789'};save();closeModal();nav('login');toast('رمزها به پیش‌فرض برگشت','success')}else toast('کلید اشتباه','error')
};

// ======= SETTINGS =======
window.changePass=()=>{
openModal(`<h3><i class="fas fa-key"></i> تغییر رمز</h3><input id="np1" value="${passwords.admin}" placeholder="رمز مدیر"><input id="np2" value="${passwords.coach}" placeholder="رمز کادر فنی"><input id="np3" value="${passwords.staff}" placeholder="رمز کادر اجرایی"><p style="color:#ff6d00;font-size:0.7rem">کلید بازیابی: <strong>${MASTER_KEY}</strong></p><div class="flex" style="justify-content:flex-end;margin-top:10px"><button class="btn btn-sm" style="background:rgba(255,255,255,0.1);color:#fff" onclick="closeModal()">انصراف</button><button class="btn btn-gold btn-sm" onclick="savePass()">ذخیره</button></div>`);
};
window.savePass=()=>{
let a=document.getElementById('np1')?.value;if(a)passwords.admin=a;

</div>`;

function renderHome(){
let stats='';

}

function renderProfile(){
let p=db.clubProfile;
let edit=['admin','coach','staff'].includes(currentUser?.role);
return `<div class="card"><div class="flex-between"><h2><i class="fas fa-building"></i> مشخصات باشگاه</h2>${edit?'<button class="btn btn-sm" style="background:rgba(100,150,250,0.2);color:#90caf9" onclick="editProfile()"><i class="fas fa-edit"></i> ویرایش</button>':''}</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px"><div><strong style="color:#ffd700">نام:</strong> ${p.name||'-'}</div><div><strong style="color:#ffd700">تأسیس:</strong> ${p.year||'-'}</div><div><strong style="color:#ffd700">ورزشگاه:</strong> ${p.stadium||'-'}</div><div><strong style="color:#ffd700">مدیر:</strong> ${p.manager||'-'}</div><div><strong style="color:#ffd700">رشته‌ها:</strong> ${p.sports||'-'}</div><div><strong style="color:#ffd700">آدرس:</strong> ${p.address||'-'}</div><div><strong style="color:#ffd700">تلفن:</strong> ${p.phone||'-'}</div><div><strong style="color:#ffd700">اینستاگرام:</strong> ${p.instagram||'-'}</div></div></div>`;
}
window.editProfile=()=>{
let p=db.clubProfile;
let f=['name','year','stadium','manager','sports','address','phone','email','instagram'];
let l=['نام','سال','ورزشگاه','مدیر','رشته‌ها','آدرس','تلفن','ایمیل','اینستاگرام'];
for(let i=0;i<f.length;i++){let v=prompt(l[i]+':',p[f[i]]||'');if(v===null)return;p[f[i]]=v}
save();nav('profile');toast('ذخیره شد','success');
};

function renderPlayers(){
if(!['admin','coach','staff'].includes(currentUser?.role))return'<div class="card"><p>دسترسی ندارید</p></div>';
let edit=['admin','coach'].includes(currentUser?.role);
let rows=db.playersData.map(p=>`<tr><td>${p.name} ${p.lastname||''}</td><td>${p.position||'-'}</td><td>${p.shirt||'-'}</td><td>${p.age||'-'}</td><td>${p.registeredAt||'-'}</td>${edit?`<td><div class="flex"><button class="btn btn-sm" style="background:rgba(100,150,250,0.2);color:#90caf9" onclick="editPlayer('${p.id}')"><i class="fas fa-edit"></i></button><button class="btn btn-red btn-sm" onclick="delPlayer('${p.id}')"><i class="fas fa-trash"></i></button></div></td>`:'<td>-</td>'}</tr>`).join('');
return `<div class="card"><div class="flex-between"><h2><i class="fas fa-users"></i> بازیکنان (${db.playersData.length})</h2>${edit?'<button class="btn btn-gold btn-sm" onclick="addPlayer()"><i class="fas fa-plus"></i> افزودن</button>':''}</div>${db.playersData.length===0?'<p style="color:#8892b0;text-align:center">هیچ بازیکنی ثبت نشده</p>':`<div style="overflow-x:auto"><table><thead><tr><th>نام</th><th>پست</th><th>شماره</th><th>سن</th><th>تاریخ ثبت</th>${edit?'<th>عملیات</th>':''}</tr></thead><tbody>${rows}</tbody></table></div>`}</div>`;
}
window.addPlayer=()=>{let n=prompt('نام:');if(!n)return;let l=prompt('نام خانوادگی:')||'';let p=prompt('پست:')||'';let s=prompt('شماره:')||'';let a=prompt('سن:')||'';db.playersData.push({id:gid(),name:n,lastname:l,position:p,shirt:s,age:a,phone:'',registeredAt:new Date().toLocaleDateString('fa-IR')});save();nav('players');toast('افزوده شد','success')};
window.editPlayer=(id)=>{let p=db.playersData.find(x=>x.id===id);if(!p)return;let n=prompt('نام:',p.name);if(n===null)return;let l=prompt('نام خانوادگی:',p.lastname);if(l===null)return;let pos=prompt('پست:',p.position);if(pos===null)return;let s=prompt('شماره:',p.shirt);if(s===null)return;let a=prompt('سن:',p.age);if(a===null)return;Object.assign(p,{name:n,lastname:l,position:pos,shirt:s,age:a});save();nav('players');toast('ویرایش شد','success')};
window.delPlayer=(id)=>{let p=db.playersData.find(x=>x.id===id);if(!p)return;confirm(`حذف "${p.name} ${p.lastname}"؟`,'حذف',()=>{db.playersData=db.playersData.filter(x=>x.id!==id);save();nav('players');toast('حذف شد','success')})};

function renderAttendance(){
if(!['admin','coach','staff'].includes(currentUser?.role))return'<div class="card"><p>دسترسی ندارید</p></div>';
let edit=['admin','coach'].includes(currentUser?.role);
let today=new Date().toLocaleDateString('fa-IR');
let rows=db.playersData.map(p=>{let a=db.attendances.find(x=>x.playerId===p.id&&x.date===today);let st=a?a.status:'ثبت نشده';let bg=st==='حاضر'?'badge-green':st==='غایب'?'badge-red':'';return`<div class="player-row"><div class="info"><strong style="color:#ffd700">${p.name} ${p.lastname||''}</strong> <span style="color:#8892b0;font-size:0.75rem">${p.position||'-'} | ${p.age||'-'} سال</span> <span class="badge ${bg}">${st}</span></div>${edit?`<div class="flex"><button class="btn btn-green btn-xs" onclick="markAtt('${p.id}','${p.name} ${p.lastname||''}','حاضر')"><i class="fas fa-check"></i> حاضر</button><button class="btn btn-red btn-xs" onclick="markAtt('${p.id}','${p.name} ${p.lastname||''}','غایب')"><i class="fas fa-times"></i> غایب</button></div>`:''}</div>`}).join('');
let hist=db.attendances.slice().reverse().slice(0,15).map(a=>`<tr><td>${a.playerName}</td><td>${a.date}</td><td><span class="badge ${a.status==='حاضر'?'badge-green':'badge-red'}">${a.status}</span></td>${edit?`<td><button class="btn btn-red btn-xs" onclick="delAtt('${a.id}')"><i class="fas fa-trash"></i></button></td>`:'<td>-</td>'}</tr>`).join('');
return `<div class="card"><h2><i class="fas fa-clipboard-check"></i> حضور و غیاب (${today})</h2>${db.playersData.length===0?'<p style="color:#8892b0;text-align:center">بازیکنی ثبت نشده</p>':rows}${hist?`<div class="card mt-10"><h3 style="color:#ffd700;font-size:0.95rem">تاریخچه</h3><div style="overflow-x:auto"><table><thead><tr><th>بازیکن</th><th>تاریخ</th><th>وضعیت</th>${edit?'<th>عملیات</th>':''}</tr></thead><tbody>${hist}</tbody></table></div></div>`:''}</div>`;
}
window.markAtt=(id,name,st)=>{let today=new Date().toLocaleDateString('fa-IR');db.attendances=db.attendances.filter(a=>!(a.playerId===id&&a.date===today));db.attendances.push({id:gid(),playerId:id,playerName:name,date:today,status:st});save();nav('attendance');toast(`${name}: ${st}`,'success')};
window.delAtt=(id)=>{confirm('حذف شود؟','حذف',()=>{db.attendances=db.attendances.filter(a=>a.id!==id);save();nav('attendance')})};

function renderContracts(){
if(!['admin','coach','staff'].includes(currentUser?.role))return'<div class="card"><p>دسترسی ندارید</p></div>';
let edit=['admin','coach'].includes(currentUser?.role);
let rows=db.contracts.map((c,i)=>`<tr><td>${c.playerName}</td><td>${c.amount}</td><td>${c.start}</td><td>${c.end}</td>${edit?`<td><button class="btn btn-red btn-xs" onclick="delContract(${i})"><i class="fas fa-trash"></i></button></td>`:'<td>-</td>'}</tr>`).join('');
return `<div class="card"><div class="flex-between"><h2><i class="fas fa-file-contract"></i> قراردادها</h2>${edit?'<button class="btn btn-gold btn-sm" onclick="addContract()"><i class="fas fa-plus"></i> افزودن</button>':''}</div>${db.contracts.length===0?'<p style="color:#8892b0;text-align:center">قراردادی ثبت نشده</p>':`<div style="overflow-x:auto"><table><thead><tr><th>بازیکن</th><th>مبلغ</th><th>شروع</th><th>پایان</th>${edit?'<th>عملیات</th>':''}</tr></thead><tbody>${rows}</tbody></table></div>`}</div>`;
}
window.addContract=()=>{let n=prompt('نام بازیکن:');if(!n)return;let a=prompt('مبلغ:')||'';let s=prompt('شروع:')||'';let e=prompt('پایان:')||'';db.contracts.push({playerName:n,amount:a,start:s,end:e});save();nav('contracts');toast('ثبت شد','success')};
window.delContract=(i)=>{confirm('حذف شود؟','حذف',()=>{db.contracts.splice(i,1);save();nav('contracts')})};

function renderInsurance(){
if(!['admin','coach','staff'].includes(currentUser?.role))return'<div class="card"><p>دسترسی ندارید</p></div>';
let edit=['admin','coach'].includes(currentUser?.role);
let rows=db.insurances.map((ins,i)=>`<tr><td>${ins.playerName}</td><td>${ins.company}</td><td>${ins.code}</td><td>${ins.expiry}</td>${edit?`<td><button class="btn btn-red btn-xs" onclick="delInsurance(${i})"><i class="fas fa-trash"></i></button></td>`:'<td>-</td>'}</tr>`).join('');
return `<div class="card"><div class="flex-between"><h2><i class="fas fa-shield-alt"></i> بیمه</h2>${edit?'<button class="btn btn-gold btn-sm" onclick="addInsurance()"><i class="fas fa-plus"></i> افزودن</button>':''}</div>${db.insurances.length===0?'<p style="color:#8892b0;text-align:center">بیمه‌ای ثبت نشده</p>':`<div style="overflow-x:auto"><table><thead><tr><th>بازیکن</th><th>شرکت</th><th>کد</th><th>انقضا</th>${edit?'<th>عملیات</th>':''}</tr></thead><tbody>${rows}</tbody></table></div>`}</div>`;
}
window.addInsurance=()=>{let n=prompt('نام بازیکن:');if(!n)return;let c=prompt('شرکت:')||'';let cd=prompt('کد:')||'';let e=prompt('انقضا:')||'';db.insurances.push({playerName:n,company:c,code:cd,expiry:e});save();nav('insurance');toast('ثبت شد','success')};
window.delInsurance=(i)=>{confirm('حذف شود؟','حذف',()=>{db.insurances.splice(i,1);save();nav('insurance')})};

function renderPosts(){
if(!['admin','coach','staff'].includes(currentUser?.role))return'<div class="card"><p>دسترسی ندارید</p></div>';
let edit=['admin','coach'].includes(currentUser?.role);
let list=db.posts.map((p,i)=>`<div style="padding:8px 0;border-bottom:1px solid rgba(255,215,0,0.15)"><div class="flex-between"><strong style="color:#ffd700">${p.title}</strong>${edit?`<button class="btn btn-red btn-xs" onclick="delPost(${i})"><i class="fas fa-trash"></i></button>`:''}</div><p style="color:#8892b0;font-size:0.8rem">${p.content}</p><small style="color:#666">${p.date}</small></div>`).join('');
return `<div class="card"><div class="flex-between"><h2><i class="fas fa-bullhorn"></i> اطلاعیه‌ها</h2>${edit?'<button class="btn btn-gold btn-sm" onclick="addPost()"><i class="fas fa-plus"></i> جدید</button>':''}</div>${db.posts.length===0?'<p style="color:#8892b0;text-align:center">اطلاعیه‌ای ثبت نشده</p>':list}</div>`;
}
window.addPost=()=>{let t=prompt('عنوان:');if(!t)return;let c=prompt('متن:')||'';db.posts.push({title:t,content:c,date:new Date().toLocaleDateString('fa-IR')});save();nav('posts');toast('ثبت شد','success')};
window.delPost=(i)=>{confirm('حذف شود؟','حذف',()=>{db.posts.splice(i,1);save();nav('posts')})};

function renderContact(){
return `<div class="card"><h2><i class="fas fa-headset"></i> ارتباط با مدیریت</h2><input id="cName" value="${currentUser?.name||''}" ${currentUser?'readonly':''} placeholder="نام"><input id="cSubject" placeholder="موضوع"><textarea id="cMsg" placeholder="پیام شما..."></textarea><button class="btn btn-gold" onclick="sendMsg()"><i class="fas fa-paper-plane"></i> ارسال</button><hr><p><i class="fas fa-phone"></i> <strong style="color:#ffd700">تلفن:</strong> ${db.clubProfile.phone||'-'}</p></div>`;
}
window.sendMsg=()=>{let m=document.getElementById('cMsg')?.value;if(!m){toast('پیام را وارد کنید','error');return}document.getElementById('cMsg').value='';document.getElementById('cSubject').value='';toast('پیام ارسال شد','success')};

function renderSettings(){
if(currentUser?.role!=='admin')return'<div class="card"><p>فقط مدیر</p></div>';
return `<div class="card"><h2><i class="fas fa-cog"></i> تنظیمات</h2><button class="btn btn-blue" onclick="changePass()"><i class="fas fa-key"></i> تغییر رمزهای ورود</button><p style="color:#8892b0;margin-top:8px;font-size:0.8rem">رمزهای فعلی: مدیر: <strong>${passwords.admin}</strong> | کادر: <strong>${passwords.coach}</strong> | اجرایی: <strong>${passwords.staff}</strong></p><p style="color:#ff6d00;font-size:0.75rem">🔑 کلید بازیابی: <strong>${MASTER_KEY}</strong></p><hr><h3 style="color:#e74c3c">بازنشانی کامل</h3><p style="color:#8892b0;font-size:0.8rem">تمام داده‌ها پاک می‌شود</p><button class="btn btn-red" onclick="resetAll()"><i class="fas fa-exclamation-triangle"></i> بازنشانی</button></div>`;
}
window.resetAll=()=>{confirm('همه اطلاعات پاک شود؟','⚠️ بازنشانی',()=>{localStorage.clear();location.reload()})};

function renderBackup(){
if(currentUser?.role!=='admin')return'<div class="card"><p>فقط مدیر</p></div>';
return `<div class="card"><h2><i class="fas fa-database"></i> پشتیبان‌گیری</h2><div class="flex"><button class="btn btn-blue" onclick="exportB()"><i class="fas fa-download"></i> دانلود</button><button class="btn btn-gold" onclick="document.getElementById('bf').click()"><i class="fas fa-upload"></i> بازیابی</button></div><input type="file" id="bf" accept=".json" style="display:none" onchange="importB(event)"><hr><p style="color:#8892b0">بازیکنان: ${db.playersData.length} | حضورها: ${db.attendances.length} | قراردادها: ${db.contracts.length}</p></div>`;
}
window.exportB=()=>{let d={playersData:db.playersData,attendances:db.attendances,contracts:db.contracts,insurances:db.insurances,posts:db.posts,clubProfile:db.clubProfile,passwords,date:new Date().toLocaleString('fa-IR')};let b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='miladmehr_backup.json';a.click();toast('دانلود شد','success')};
window.importB=(e)=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{try{let d=JSON.parse(ev.target.result);confirm('جایگزین شود؟','بازیابی',()=>{if(d.playersData)db.playersData=d.playersData;if(d.attendances)db.attendances=d.attendances;if(d.contracts)db.contracts=d.contracts;if(d.insurances)db.insurances=d.insurances;if(d.posts)db.posts=d.posts;if(d.clubProfile)db.clubProfile=d.clubProfile;if(d.passwords)passwords=d.passwords;save();nav('home');toast('بازیابی شد','success')})}catch(err){toast('فایل نامعتبر','error')}};r.readAsText(f)};

function renderMyAttendance(){
let my=db.attendances.filter(a=>a.playerName===currentUser?.name);
return `<div class="card"><h2><i class="fas fa-calendar-check"></i> حضورهای من</h2>${my.length===0?'<p style="color:#8892b0;text-align:center">موردی ثبت نشده</p>':my.map(a=>`<div style="padding:6px 0;border-bottom:1px solid rgba(255,215,0,0.15);display:flex;justify-content:space-between"><span>${a.date}</span><span class="badge ${a.status==='حاضر'?'badge-green':'badge-red'}">${a.status}</span></div>`).join('')}</div>`;
}
function renderMyContract(){
let c=db.contracts.find(x=>x.playerName===currentUser?.name);
return `<div class="card"><h2><i class="fas fa-file-signature"></i> قرارداد من</h2>${c?`<p><strong style="color:#ffd700">مبلغ:</strong> ${c.amount} تومان</p><p><strong style="color:#ffd700">شروع:</strong> ${c.start}</p><p><strong style="color:#ffd700">پایان:</strong> ${c.end}</p>`:'<p style="color:#8892b0;text-align:center">قراردادی ثبت نشده</p>'}</div>`;
}
function renderMyInsurance(){
let ins=db.insurances.find(x=>x.playerName===currentUser?.name);
return `<div class="card"><h2><i class="fas fa-shield-alt"></i> بیمه من</h2>${ins?`<p><strong style="color:#ffd700">شرکت:</strong> ${ins.company}</p><p><strong style="color:#ffd700">کد:</strong> ${ins.code}</p><p><strong style="color:#ffd700">انقضا:</strong> ${ins.expiry}</p>`:'<p style="color:#8892b0;text-align:center">بیمه‌ای ثبت نشده</p>'}</div>`;
}

// ======= PWA INSTALL =======
window.install=()=>{
if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(r=>{if(r.outcome==='accepted')toast('نصب شد! 🎉','success');deferredPrompt=null})}
else{
let banner=document.getElementById('installBanner');
if(banner)banner.classList.add('show');
toast('منوی مرورگر → افزودن به صفحه اصلی','success')
}
};

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;let banner=document.getElementById('installBanner');if(banner)banner.classList.add('show')});
window.addEventListener('appinstalled',()=>{toast('اپلیکیشن با موفقیت نصب شد 🎉','success')});

// ======= INIT =======
window.nav=nav;
window.toggleSidebar=toggleSidebar;
window.install=install;
load();updateUI();nav(currentUser?'home':'login');
})();
</script>
